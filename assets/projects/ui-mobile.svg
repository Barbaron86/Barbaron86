  <clipPath id="project-ui-mobile-art-clip"><rect width="226" height="266" rx="17"/></clipPath>
</defs>
<rect x="1" y="1" width="358" height="426" rx="22" fill="url(#project-ui-mobile-bg)" stroke="url(#project-ui-mobile-edge)"/>
<g aria-hidden="true" clip-path="url(#project-ui-mobile-clip)"><ellipse cx="360" cy="325.28" rx="151.2" ry="363.8" fill="url(#project-ui-mobile-halo)" opacity=".65"/><ellipse cx="0" cy="428" rx="115.2" ry="368.08" fill="url(#project-ui-mobile-purple)" opacity=".65"/><ellipse cx="259.2" cy="0" rx="108" ry="342.4" fill="url(#project-ui-mobile-purple)" opacity=".32"/><path d="M24 2H336" stroke="#f0efff" stroke-opacity=".44"/><path d="M8 24Q8 8 24 8H162" fill="none" stroke="#c4d8ff" stroke-opacity=".18" stroke-width="3" stroke-linecap="round" filter="url(#project-ui-mobile-glow)"/></g>
