<title id="projects-board-mobile-title">autotest-ui — UI Test Automation</title>
<desc id="projects-board-mobile-desc">A Playwright-based UI testing framework with Page Object architecture, parallel cross-browser execution, reusable authentication state, Allure reporting and CI/CD. Technologies: Python, Playwright, Pytest, pytest-xdist, Allure, Ruff, Mypy. Open the project repository.</desc>
