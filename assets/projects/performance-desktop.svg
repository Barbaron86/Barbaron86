<title id="project-performance-desktop-title">performance-tests — Performance &amp; Load Testing</title>
<desc id="project-performance-desktop-desc">A Locust-based load testing framework with decoupled HTTP/gRPC clients, automated test data seeding, Prometheus/Grafana monitoring and CI/CD reporting. Technologies: Python, Locust, gRPC, HTTPX, Docker, Prometheus, Grafana. Open the project repository.</desc>
