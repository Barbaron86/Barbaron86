<svg xmlns="http://www.w3.org/2000/svg" width="940" height="258" viewBox="0 0 940 258" role="img" aria-labelledby="title description">
<title id="title">{{USERNAME}} GitHub Streak</title>
<desc id="description">Total contributions: {{TOTAL}} since {{FIRST_CONTRIBUTION}}. Current streak: {{CURRENT}} days, {{CURRENT_RANGE}}. Next goal: {{NEXT_GOAL}} days, {{PROGRESS_PERCENT}} percent complete. Longest streak: {{LONGEST}} days, {{LONGEST_RANGE}}. Contributions {{CURRENT_YEAR}}: {{THIS_YEAR}}. Active days {{CURRENT_YEAR}}: {{ACTIVE_DAYS}}. Best day: {{BEST_DAY_COUNT}} on {{BEST_DAY_DATE}}. Last contribution: {{LAST_ACTIVE}}.</desc>
{{CARD_FRAME}}
<rect x="15" y="15" width="258" height="228" rx="15" fill="{{GLASS}}" fill-opacity="{{GLASS_OPACITY}}" stroke="{{INNER_BORDER}}"/>
<path d="M290 137H923M502 35V230M714 35V230" stroke="{{DIVIDER}}" stroke-opacity="{{DIVIDER_OPACITY}}"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="36" y="44" fill="{{MUTED}}" font-size="14" font-weight="700" letter-spacing="1">GITHUB STREAK</text>
<circle cx="249" cy="38" r="4" fill="{{PINK}}"/>
<text id="current-streak-value" x="144" y="123" text-anchor="middle" fill="{{PRIMARY}}" font-size="{{CURRENT_FONT_SIZE}}" font-weight="750">{{CURRENT}}</text>
<text x="144" y="151" text-anchor="middle" fill="{{PURPLE}}" font-size="14" font-weight="700">CURRENT STREAK · DAYS</text>
<text x="144" y="174" text-anchor="middle" fill="{{MUTED}}" font-size="11">{{CURRENT_RANGE}}</text>
<rect x="58" y="190" width="172" height="6" rx="3" fill="{{TRACK}}"/>
<rect id="streak-progress-fill" x="58" y="190" width="{{PROGRESS_WIDTH}}" height="6" rx="3" fill="url(#activity-accent)"/>
<text x="144" y="220" text-anchor="middle" fill="{{MUTED}}" font-size="12">NEXT GOAL · {{NEXT_GOAL}} DAYS</text>
<text x="396" y="60" text-anchor="middle" fill="{{MUTED}}" font-size="14">TOTAL CONTRIBUTIONS</text>
<text x="396" y="105" text-anchor="middle" fill="{{PRIMARY}}" font-size="{{TOTAL_FONT_SIZE}}" font-weight="750">{{TOTAL}}</text>
<text x="396" y="123" text-anchor="middle" fill="{{MUTED}}" font-size="11">Since {{FIRST_CONTRIBUTION}}</text>
<text x="608" y="60" text-anchor="middle" fill="{{MUTED}}" font-size="14">LONGEST STREAK</text>
<text x="608" y="105" text-anchor="middle" fill="{{PURPLE}}" font-size="{{LONGEST_FONT_SIZE}}" font-weight="750">{{LONGEST}} <tspan font-size="12" fill="{{MUTED}}">days</tspan></text>
<text x="608" y="123" text-anchor="middle" fill="{{MUTED}}" font-size="11">{{LONGEST_RANGE}}</text>
<text x="819" y="60" text-anchor="middle" fill="{{MUTED}}" font-size="14">THIS YEAR</text>
<text x="819" y="105" text-anchor="middle" fill="{{BLUE}}" font-size="{{YEAR_FONT_SIZE}}" font-weight="750">{{THIS_YEAR}}</text>
<text x="819" y="123" text-anchor="middle" fill="{{MUTED}}" font-size="11">Contributions {{CURRENT_YEAR}}</text>
<text x="396" y="165" text-anchor="middle" fill="{{MUTED}}" font-size="14">ACTIVE DAYS</text>
<text x="396" y="207" text-anchor="middle" fill="{{PRIMARY}}" font-size="34" font-weight="700">{{ACTIVE_DAYS}}</text>
<text x="396" y="224" text-anchor="middle" fill="{{MUTED}}" font-size="11">Days with contributions · {{CURRENT_YEAR}}</text>
<text x="608" y="165" text-anchor="middle" fill="{{MUTED}}" font-size="14">BEST DAY</text>
<text x="608" y="207" text-anchor="middle" fill="{{PINK}}" font-size="34" font-weight="700">{{BEST_DAY_COUNT}}</text>
<text x="608" y="224" text-anchor="middle" fill="{{MUTED}}" font-size="11">{{BEST_DAY_DATE}}</text>
<text x="820" y="165" text-anchor="middle" fill="{{MUTED}}" font-size="14">LAST ACTIVE</text>
<text x="820" y="205" text-anchor="middle" fill="{{PRIMARY}}" font-size="17" font-weight="650">{{LAST_ACTIVE}}</text>
<text x="820" y="224" text-anchor="middle" fill="{{MUTED}}" font-size="11">Most recent contribution</text>
</g>
</svg>
