<title id="project-isolation-desktop-title">isolation-api-tests — Isolated API &amp; Integration Testing</title>
<desc id="project-isolation-desktop-desc">An API testing framework with custom FastAPI mocks for service isolation. Tests real HTTP/gRPC interactions, Kafka events and PostgreSQL data. Technologies: Python, Pytest, FastAPI, HTTPX, gRPC, Kafka, PostgreSQL, Docker, Allure. Open the project repository.</desc>
