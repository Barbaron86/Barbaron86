<svg xmlns="http://www.w3.org/2000/svg" width="360" height="368" viewBox="0 0 360 368" role="img" aria-labelledby="project-ui-mobile-title project-ui-mobile-desc">
<title id="project-ui-mobile-title">autotest-ui — UI Test Automation</title>
<desc id="project-ui-mobile-desc">A Playwright-based UI testing framework with Page Object architecture, parallel cross-browser execution, reusable authentication state, Allure reporting and CI/CD. Technologies: Python, Playwright, Pytest, pytest-xdist, Allure, Ruff, Mypy. Open the project repository.</desc>
<defs>
  <linearGradient id="project-ui-mobile-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18233c"/><stop offset=".5" stop-color="#091827"/><stop offset="1" stop-color="#212248"/></linearGradient>
  <linearGradient id="project-ui-mobile-edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ada1de"/><stop offset=".48" stop-color="#426c96"/><stop offset="1" stop-color="#8f9ff1"/></linearGradient>
  <linearGradient id="project-ui-mobile-glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d2ddff" stop-opacity=".25"/><stop offset=".5" stop-color="#7293ee" stop-opacity=".09"/><stop offset="1" stop-color="#5969b9" stop-opacity=".23"/></linearGradient>
  <linearGradient id="project-ui-mobile-blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a4eeff"/><stop offset=".5" stop-color="#54abff"/><stop offset="1" stop-color="#8079ff"/></linearGradient>
  <linearGradient id="project-ui-mobile-violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8facff"/><stop offset=".55" stop-color="#7962d9"/><stop offset="1" stop-color="#342955"/></linearGradient>
  <radialGradient id="project-ui-mobile-halo"><stop stop-color="#548cf8" stop-opacity=".4"/><stop offset="1" stop-color="#4a77ec" stop-opacity="0"/></radialGradient>
  <filter id="project-ui-mobile-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
  <clipPath id="project-ui-mobile-clip"><rect x="1" y="1" width="358" height="366" rx="22"/></clipPath>
  <clipPath id="project-ui-mobile-art-clip"><rect width="226" height="266" rx="17"/></clipPath>
</defs>
<rect x="1" y="1" width="358" height="366" rx="22" fill="url(#project-ui-mobile-bg)" stroke="url(#project-ui-mobile-edge)"/>
<g aria-hidden="true" clip-path="url(#project-ui-mobile-clip)"><ellipse cx="360" cy="368" rx="230" ry="185" fill="url(#project-ui-mobile-halo)"/><path d="M24 2H336" stroke="#e0e8ff" stroke-opacity=".16"/><ellipse cx="0" cy="0" rx="150" ry="130" fill="#a478df" opacity=".055"/></g>
<g aria-hidden="true" transform="translate(20 24) scale(0.725)"><rect x="1" y="1" width="78" height="78" rx="18" fill="url(#project-ui-mobile-glass)" stroke="#8298d6"/><ellipse cx="40" cy="44" rx="32" ry="30" fill="url(#project-ui-mobile-halo)"/><rect x="18" y="20" width="44" height="32" rx="3" fill="#278afb" opacity=".4" filter="url(#project-ui-mobile-glow)"/>
<rect x="18" y="20" width="44" height="32" rx="3" fill="#142d52" stroke="url(#project-ui-mobile-blue)" stroke-width="3"/>
<path d="M40 54V63M29 65H51" stroke="#76baff" stroke-width="4" stroke-linecap="round"/></g><text x="91" y="45" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="650" fill="#f3f6ff">autotest-ui</text><text x="91" y="68" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#9ccaff">UI Test Automation</text><text x="20" y="136" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#e0e8f6">A Playwright-based UI testing framework</text><text x="20" y="158" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#e0e8f6">with Page Object architecture, parallel</text><text x="20" y="180" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#e0e8f6">cross-browser execution, reusable</text><text x="20" y="202" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#e0e8f6">authentication state, Allure reporting and</text><text x="20" y="224" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#e0e8f6">CI/CD.</text><g aria-label="Technology stack"><g transform="translate(20 245)"><rect width="67" height="26" rx="13" fill="#1a3c70" stroke="#4388e3" stroke-opacity=".7"/><path d="M13 2H54" stroke="#ffffff" stroke-opacity=".15"/><text x="12" y="18" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#baddff">Python</text></g><g transform="translate(95 245)"><rect width="90" height="26" rx="13" fill="#16422c" stroke="#329967" stroke-opacity=".7"/><path d="M13 2H77" stroke="#ffffff" stroke-opacity=".15"/><text x="12" y="18" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#adf7c7">Playwright</text></g><g transform="translate(193 245)"><rect width="63" height="26" rx="13" fill="#2c3a4b" stroke="#566576" stroke-opacity=".7"/><path d="M13 2H50" stroke="#ffffff" stroke-opacity=".15"/><text x="12" y="18" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-