<path d="M40 54V63M29 65H51" stroke="#76baff" stroke-width="4" stroke-linecap="round"/></g><text x="91" y="45" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="650" fill="#f3f6ff">autotest-ui</text><text x="91" y="68" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#9ccaff">UI Test Automation</text><text x="20" y="136" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#e0e8f6">A Playwright-based UI testing</text><text x="20" y="159" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#e0e8f6">framework with Page Object</text><text x="20" y="182" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#e0e8f6">architecture, parallel cross-browser</text><text x="20" y="205" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#e0e8f6">execution, reusable authentication</text><text x="20" y="228" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#e0e8f6">state, Allure reporting and CI/CD.</text><g aria-label="Technology stack"><g transform="translate(20 258)"><rect width="74" height="28" rx="14" fill="#1a3c70" fill-opacity=".65" stroke="#4388e3"/><rect width="74" height="28" rx="14" fill="url(#project-ui-mobile-glass)"/><path d="M13 2H61" stroke="#ffffff" stroke-opacity=".15"/><text x="12" y="19" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#baddff">Python</text></g><g transform="translate(102 258)"><rect width="100" height="28" rx="14" fill="#16422c" fill-opacity=".65" stroke="#329967"/><rect width="100" height="28" rx="14" fill="url(#project-ui-mobile-glass)"/><path d="M13 2H87" stroke="#ffffff" stroke-opacity=".15"/><text x="12" y="19" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#adf7c7">Playwright</text></g><g transform="translate(210 258)"><rect width="69" height="28" rx="14" fill="#2c3a4b" fill-opacity=".65" stroke="#566576"/><rect width="69" height="28" rx="14" fill="url(#project-ui-mobile-glass)"/><path d="M13 2H56" stroke="#ffffff" stroke-opacity=".15"/><text x="12" y="19" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#e0e7ef">Pytest</text></g><g transform="translate(20 292)"><rect width="115" height="28" rx="14" fill="#2c3a4b" fill-opacity=".65" stroke="#566576"/><rect width="115" height="28" rx="14" fill="url(#project-ui-mobile-glass)"/><path d="M13 2H102" stroke="#ffffff" stroke-opacity=".15"/><text x="12" y="19" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#e0e7ef">pytest-xdist</text></g><g transform="translate(143 292)"><rect width="65" height="28" rx="14" fill="#16422c" fill-opacity=".65" stroke="#329967"/><rect width="65" height="28" rx="14" fill="url(#project-ui-mobile-glass)"/><path d="M13 2H52" stroke="#ffffff" stroke-opacity=".15"/><text x="12" y="19" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#adf7c7">Allure</text></g><g transform="translate(216 292)"><rect width="51" height="28" rx="14" fill="#312258" fill-opacity=".65" stroke="#7761cf"/><rect width="51" height="28" rx="14" fill="url(#project-ui-mobile-glass)"/><path d="M13 2H38" stroke="#ffffff" stroke-opacity=".15"/><text x="12" y="19" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#dbccff">Ruff</text></g><g transform="translate(275 292)"><rect width="64" height="28" rx="14" fill="#262b62" fill-opacity=".65" stroke="#6376d8"/><rect width="64" height="28" rx="14" fill="url(#project-ui-mobile-glass)"/><path d="M13 2H51" stroke="#ffffff" stroke-opacity=".15"/><text x="12" y="19" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#d4d9ff">Mypy</text></g></g>
</svg>
