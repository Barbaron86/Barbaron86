<title id="projects-board-desktop-title">isolation-api-tests — Isolated API &amp; Integration Testing</title>
<desc id="projects-board-desktop-desc">Isolated API testing with custom HTTP/gRPC mock servers, real service interactions, and validation of Kafka-driven operations and PostgreSQL data. Technologies: Python, Pytest, FastAPI, HTTPX, gRPC, Kafka, PostgreSQL, Docker, Allure.</desc>
