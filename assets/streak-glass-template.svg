<svg xmlns="http://www.w3.org/2000/svg" width="940" height="258" viewBox="0 0 940 258" role="img" aria-labelledby="title description">
<title id="title">{{USERNAME}} GitHub Streak</title>
<desc id="description">Total contributions: {{TOTAL}} since {{FIRST_CONTRIBUTION}}. Current streak: {{CURRENT}} days. Longest streak: {{LONGEST}} days. Contributions {{CURRENT_YEAR}}: {{THIS_YEAR}}. Active days: {{ACTIVE_DAYS}}. Best day: {{BEST_DAY_COUNT}} on {{BEST_DAY_DATE}}. Last contribution: {{LAST_ACTIVE}}.</desc>
<defs>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="{{BG_START}}"/><stop offset="1" stop-color="{{BG_END}}"/></linearGradient>
<linearGradient id="accent" x1="0" y1="1" x2="1" y2="0"><stop stop-color="{{BLUE}}"/><stop offset=".58" stop-color="{{PURPLE}}"/><stop offset="1" stop-color="{{PINK}}"/></linearGradient>
<linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1"><stop stop-color="{{BLUE}}" stop-opacity=".22"/><stop offset="1" stop-color="{{PURPLE}}" stop-opacity=".025"/></linearGradient>
<radialGradient id="haze"><stop stop-color="{{PURPLE}}" stop-opacity=".19"/><stop offset="1" stop-color="{{PURPLE}}" stop-opacity="0"/></radialGradient>
<clipPath id="round"><rect x="1" y="1" width="938" height="256" rx="19"/></clipPath>
</defs>
<rect x="1" y="1" width="938" height="256" rx="19" fill="url(#panel)" stroke="{{BORDER}}" stroke-width="1.5"/>
<g clip-path="url(#round)">
<ellipse cx="210" cy="250" rx="340" ry="235" fill="url(#haze)"/>
<path d="M0 242 57 190 100 219 171 160 236 225 280 187 348 246 440 204 529 250 650 190 759 243 849 207 940 250V258H0Z" fill="url(#mountain)"/>
<path d="M0 250 77 215 145 248 244 192 320 250 414 220 507 257 633 219 749 256 836 227 940 257" fill="none" stroke="{{BLUE}}" stroke-opacity=".22"/>
<path d="M2 2H938" stroke="{{HIGHLIGHT}}" stroke-opacity=".4"/>
<rect x="15" y="15" width="258" height="228" rx="15" fill="{{GLASS}}" fill-opacity="{{GLASS_OPACITY}}" stroke="{{INNER_BORDER}}"/>
<rect x="15" y="15" width="258" height="3" rx="1.5" fill="url(#accent)"/>
<path d="M290 137H923M502 35V230M714 35V230" stroke="{{DIVIDER}}" stroke-opacity="{{DIVIDER_OPACITY}}" stroke-width="1"/>
</g>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
<text x="36" y="44" fill="{{MUTED}}" font-size="12" font-weight="700" letter-spacing="1.6">GITHUB STREAK</text>
<circle cx="249" cy="38" r="4" fill="{{PINK}}"/>
<text x="144" y="123" text-anchor="middle" fill="{{PRIMARY}}" font-size="73" font-weight="750">{{CURRENT}}</text>
<text x="144" y="151" text-anchor="middle" fill="{{PURPLE}}" font-size="14" font-weight="700">CURRENT STREAK · DAYS</text>
<text x="144" y="174" text-anchor="middle" fill="{{MUTED}}" font-size="11">{{CURRENT_RANGE}}</text>
<rect x="58" y="198" width="172" height="5" rx="2.5" fill="{{TRACK}}"/>
<rect x="58" y="198" width="172" height="5" rx="2.5" fill="url(#accent)" fill-opacity="{{BAR_OPACITY}}"/>
<text x="396" y="60" text-anchor="middle" fill="{{MUTED}}" font-size="11" letter-spacing=".7">TOTAL CONTRIBUTIONS</text>
<text x="396" y="105" text-anchor="middle" fill="{{PRIMARY}}" font-size="34" font-weight="750">{{TOTAL}}</text>
<text x="396" y="123" text-anchor="middle" fill="{{MUTED}}" font-size="10">Since {{FIRST_CONTRIBUTION}}</text>
<text x="608" y="60" text-anchor="middle" fill="{{MUTED}}" font-size="11" letter-spacing=".7">LONGEST STREAK</text>
<text x="608" y="105" text-anchor="middle" fill="{{PURPLE}}" font-size="34" font-weight="750">{{LONGEST}} <tspan font-size="12" fill="{{MUTED}}">days</tspan></text>
<text x="608" y="123" text-anchor="middle" fill="{{MUTED}}" font-size="9.5">{{LONGEST_RANGE}}</text>
<text x="819" y="60" text-anchor="middle" fill="{{MUTED}}" font-size="10" letter-spacing=".5">THIS YEAR</text>
<text x="819" y="105" text-anchor="middle" fill="{{BLUE}}" font-size="32" font-weight="750">{{THIS_YEAR}}</text>
<text x="819" y="123" text-anchor="middle" fill="{{MUTED}}" font-size="10">Contributions {{CURRENT_YEAR}}</text>
<text x="396" y="165" text-anchor="middle" fill="{{MUTED}}" font-size="11" letter-spacing=".7">ACTIVE DAYS</text>
<text x="396" y="207" text-anchor="middle" fill="{{PRIMARY}}" font-size="31" font-weight="700">{{ACTIVE_DAYS}}</text>
<text x="396" y="224" text-anchor="middle" fill="{{MUTED}}" font-size="10">Days with contributions</text>
<text x="608" y="165" text-anchor="middle" fill="{{MUTED}}" font-size="11" letter-spacing=".7">BEST DAY</text>
<text x="608" y="207" text-anchor="middle" fill="{{PINK}}" font-size="31" font-weight="700">{{BEST_DAY_COUNT}}</text>
<text x="608" y="224" text-anchor="middle" fill="{{MUTED}}" font-size="10">{{BEST_DAY_DATE}}</text>
<text x="820" y="165" text-anchor="middle" fill="{{MUTED}}" font-size="11" letter-spacing=".7">LAST ACTIVE</text>
<text x="820" y="205" text-anchor="middle" fill="{{PRIMARY}}" font-size="17" font-weight="650">{{LAST_ACTIVE}}</text>
<text x="820" y="224" text-anchor="middle" fill="{{MUTED}}" font-size="10">Most recent contribution</text>
</g></svg>
