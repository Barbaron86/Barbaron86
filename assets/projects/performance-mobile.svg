<svg xmlns="http://www.w3.org/2000/svg" width="360" height="374" viewBox="0 0 360 374" role="img" aria-labelledby="project-performance-mobile-title project-performance-mobile-desc">
<title id="project-performance-mobile-title">performance-tests — Performance &amp; Load Testing</title>
<desc id="project-performance-mobile-desc">A Locust-based load testing framework with decoupled HTTP/gRPC clients, automated test data seeding, Prometheus/Grafana monitoring and CI/CD reporting. Technologies: Python, Locust, gRPC, HTTPX, Docker, Prometheus, Grafana. Open the project repository.</desc>
