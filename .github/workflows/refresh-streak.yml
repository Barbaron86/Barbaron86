name: Refresh GitHub Streak

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  refresh-streak:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate streak SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          python scripts/generate_streak.py

      - name: Checkout output branch
        uses: actions/checkout@v7
        with:
          ref: output
          path: profile-output
          fetch-depth: 1

      - name: Update streak assets
        run: |
          cp dist/streak.svg profile-output/streak.svg
          cp dist/streak-dark.svg profile-output/streak-dark.svg
          cp dist/streak-light.svg profile-output/streak-light.svg
          cp dist/streak-mobile-dark.svg profile-output/streak-mobile-dark.svg
          cp dist/streak-mobile-light.svg profile-output/streak-mobile-light.svg

      - name: Publish streak asset
        working-directory: profile-output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain -- streak.svg streak-dark.svg streak-light.svg streak-mobile-dark.svg streak-mobile-light.svg)" ]; then
            echo "Streak SVG is already up to date."
            exit 0
          fi

          git add streak.svg streak-dark.svg streak-light.svg streak-mobile-dark.svg streak-mobile-light.svg
          git commit -m "chore: refresh streak stats"
          git push
