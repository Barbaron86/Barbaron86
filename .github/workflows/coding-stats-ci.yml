name: Coding Practice CI

on:
  pull_request:
    paths:
      - "scripts/**"
      - "assets/codewars-logo.svg"
      - ".github/workflows/coding-stats*.yml"
  push:
    branches: [feat/coding-practice-cards]
    paths:
      - "scripts/**"
      - "assets/codewars-logo.svg"
      - ".github/workflows/coding-stats*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: python -m compileall -q scripts
