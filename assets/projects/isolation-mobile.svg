<title id="projects-board-mobile-title">isolation-api-tests — Isolated API &amp; Integration Testing</title>
<desc id="projects-board-mobile-desc">An API testing framework with custom FastAPI mocks for service isolation. Tests real HTTP/gRPC interactions, Kafka events and PostgreSQL data. Technologies: Python, Pytest, FastAPI, gRPC, Kafka, PostgreSQL, Docker.</desc>
