<svg xmlns="http://www.w3.org/2000/svg" width="900" height="306" viewBox="0 0 900 306" role="img" aria-labelledby="project-ui-desktop-title project-ui-desktop-desc">
<title id="project-ui-desktop-title">autotest-ui — UI Test Automation</title>
<desc id="project-ui-desktop-desc">A Playwright-based UI testing framework with Page Object architecture, parallel cross-browser execution, reusable authentication state, Allure reporting and CI/CD. Technologies: Python, Playwright, Pytest, pytest-xdist, Pydantic, Poetry, Allure, Ruff, Mypy. Open the project repository.</desc>
